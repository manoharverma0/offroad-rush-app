<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OFFROAD RUSH</title>
<style>

.b.on{background:rgba(255,179,0,.6)}
.sq{width:46px;height:46px;font-size:15px}
#bl{left:calc(var(--s) + 14px);bottom:calc(var(--b) + 14px);width:78px;height:78px}
#br{left:calc(var(--s) + 106px);bottom:calc(var(--b) + 14px);width:78px;height:78px}
#gas{right:calc(var(--r) + 14px);bottom:calc(var(--b) + 14px);width:92px;height:128px;border-radius:18px}
#brk{right:calc(var(--r) + 118px);bottom:calc(var(--b) + 14px);width:88px;height:88px;border-radius:18px}
#nit{right:calc(var(--r) + 20px);bottom:calc(var(--b) + 156px);width:64px;height:64px;color:#4cf;border-color:#4cf}
#hb{right:calc(var(--r) + 118px);bottom:calc(var(--b) + 110px);width:56px;height:44px;border-radius:12px;font-size:15px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.2));padding:var(--t) var(--r) var(--b) var(--s)}
.pn{background:rgba(10,12,16,.82);padding:14px 22px;border-radius:12px;min-width:280px;text-align:center;max-height:90vh;overflow-y:auto}
h1{margin:0;font-size:46px;font-style:italic;letter-spacing:2px}h1 span{color:var(--a)}
.mb{display:block;width:100%;margin:6px 0;padding:10px;background:#333;color:#fff;border:0;border-radius:6px;font:20px Impact,sans-serif;touch-action:manipulation}
.mb.y{background:var(--a);color:#000}
.mb2{display:inline-block;width:48%;margin:3px 1%;padding:8px;background:#333;color:#fff;border:0;border-radius:6px;font:17px Impact,sans-serif;touch-action:manipulation;vertical-align:top}
.mb2.y{background:var(--a);color:#000}
.bar{height:8px;background:#444;margin:2px 0 6px;border-radius:4px}.bar i{display:block;height:100%;background:var(--a);border-radius:4px}
.st{font:12px Arial;text-align:left}
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;color:var(--a);pointer-events:none;text-shadow:0 0 20px #000}
#map{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column}
#rot{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:9;font-size:24px;text-align:center}
@media(orientation:portrait){#rot{display:flex}}
/* HP / DAMAGE BAR */
#hpbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--b)+20px);width:170px;height:10px;background:rgba(0,0,0,.5);border-radius:5px;border:2px solid rgba(255,255,255,.25);overflow:hidden}
#hpfill{height:100%;border-radius:3px;background:#2ecc71;transition:width .15s,background .3s}
#rpr{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--t)+50px);font-size:14px;color:#0f0;opacity:0;pointer-events:none;transition:opacity .3s;text-shadow:0 0 8px #0f0}
/* MINI BUTTONS */
.sm{width:46px;height:28px;border-radius:8px;font-size:12px}
#ntb{right:calc(var(--r) + 78px);bottom:calc(var(--b) + 162px)}
#tlb{right:calc(var(--r) + 78px);bottom:calc(var(--b) + 198px)}
#tlb.tilt-on{color:#0f0;border-color:#0f0}
/* UPGRADES OVERLAY */
#upgov{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;flex-direction:column;align-items:center;justify-content:flex-start;z-index:20;overflow-y:auto;padding:12px 8px}
.upg-row{display:flex;align-items:center;gap:6px;margin:4px 0}
.upg-lbl{width:110px;font-size:14px;color:#aaa;text-align:right}
.ulv{width:70px;padding:6px 4px;border-radius:7px;background:#111;border:2px solid #333;color:#555;font:13px Impact,sans-serif;text-align:center;cursor:default}
.ulv.owned{background:#0d1a0d;border-color:#2ecc71;color:#2ecc71}
.ulv.avail{background:#0d1525;border-color:#4af;color:#4af;cursor:pointer;touch-action:manipulation}
.ulv.avail:active{background:#4af;color:#000}
/* CHAMPIONSHIP OVERLAY */
#champov{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20}
.cth{font-size:30px;color:var(--a);margin:8px 0}
.ctr{font-size:17px;margin:3px 0}
.ctr.me{color:var(--a)}
/* GHOST car pulse */
.ghost-label{position:absolute;top:calc(var(--t)+140px);left:50%;transform:translateX(-50%);font-size:13px;color:#4af;opacity:0;pointer-events:none;transition:opacity .4s}
</style></head><body>
<canvas id="c"></canvas>
<div id="rot">ROTATE YOUR DEVICE<br>TO LANDSCAPE</div>
<div id="hud">
  <div class="p" id="tl"></div>
  <div class="p" id="obj"></div>
  <div class="p" id="spd"></div>
  <canvas id="mm" width="240" height="240"></canvas>
  <div class="b sq" id="bp" style="left:calc(var(--s)+10px);top:calc(var(--t)+56px)">II</div>
  <div class="b sq" id="bc" style="left:calc(var(--s)+10px);top:calc(var(--t)+108px)">CAM</div>
  <div class="b sq" id="bm" style="left:calc(var(--s)+10px);top:calc(var(--t)+160px)">MAP</div>
  <div class="b sq" id="bx" style="left:calc(var(--s)+62px);top:calc(var(--t)+56px)">RST</div>
  <div class="b" id="bl">◀</div><div class="b" id="br">▶</div>
  <div class="b" id="brk">BRAKE</div><div class="b" id="gas">GAS</div>
  <div class="b" id="nit">NOS</div>
  <div class="b" id="hb">HB</div>
  <div class="b sm" id="ntb">🌙</div>
  <div class="b sm" id="tlb">TILT</div>
  <div id="hpbar"><div id="hpfill" style="width:100%"></div></div>
  <div id="rpr">⚡ REPAIRING</div>
  <div class="ghost-label" id="glbl">👻 GHOST</div>
</div>
<div id="cd"></div>
<div id="map"><canvas id="mc" width="560" height="560" style="max-height:78vh;max-width:78vh"></canvas><button class="mb y" style="width:200px" onclick="mapShow(0)">CLOSE</button></div>
<div id="ov"><div class="pn" id="pn"></div></div>

<!-- UPGRADES OVERLAY -->
<div id="upgov">
  <h1 style="font-size:34px;margin-bottom:4px">UPGRADES <span id="upgcoins" style="font-size:20px"></span></h1>
  <p style="color:#aaa;font:13px Arial;margin:0 0 8px">Upgrades apply to the selected vehicle</p>
  <div id="upg-content"></div>
  <button class="mb y" style="width:220px;margin-top:14px" ontouchend="closeUpg()" onclick="closeUpg()">CLOSE</button>
</div>

<!-- CHAMPIONSHIP OVERLAY -->
<div id="champov">
  <div class="cth">🏆 CHAMPIONSHIP</div>
  <div id="champ-content"></div>
  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="mb y" style="width:150px" id="champ-btn" ontouchend="champAction()" onclick="champAction()">START</button>
    <button class="mb" style="width:150px" ontouchend="closeChamp()" onclick="closeChamp()">BACK</button>
  </div>
</div>

<script src="three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id);
let Wl=-0.2;
const hs=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t,cl=(x,a,b)=>Math.min(b,Math.max(a,x));
const hash=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s)};
const rnd=(a,b)=>a+Math.random()*(b-a);
function vn(x,z){const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);return lerp(lerp(hash(i,j),hash(i+1,j),u),lerp(hash(i,j+1),hash(i+1,j+1),u),v)-.5}
const xc=z=>45*Math.sin(z/130)+12*Math.sin(z/47),zr=x=>-150+25*Math.sin(x/110);
const B=(x,z)=>6+vn(x/200,z/200)*28+vn(x/70,z/70)*6+90*hs(-150,-560,z)+160*hs(430,690,Math.max(Math.abs(x),Math.abs(z)));
function H(x,z){let h=B(x,z)+vn(x/18,z/18)*1.2+vn(x/6,z/6)*.25;const rc=xc(z),d=Math.abs(x-rc),dr=Math.abs(z-zr(x)),lane=d<6.5;
if(Math.abs(z)<600){let rh=B(rc,z);rh=lerp(rh,1.4,1-hs(15,45,Math.abs(z-zr(rc))));h=lerp(h,rh+vn(x/5,z/5)*.15,1-hs(5,14,d))}
let c=1-hs(14,30,dr);if(lane&&dr>=14)c=0;h=lerp(h,-2,c);
if(d<4.6&&dr<15)h=1.4;
if(d<8){const t=-470-z,f=1-hs(5,7,d);if(t>0&&t<14)h+=3.2*t/14*f;else if(t>=14&&t<36)h-=5*hs(14,16,t)*(1-hs(32,36,t))*f}
return h}
function nrm(x,z){return new T.Vector3(H(x-1,z)-H(x+1,z),2,H(x,z-1)-H(x,z+1)).normalize()}
const GR=[1,.88,.7,.42,.5];
function surf(x,z,h,ny){if(h<Wl)return 4;const d=Math.abs(x-xc(z));if(z<-230&&z>-340&&d<110&&vn(x/25,z/25)>.08)return 3;if(ny<.78||h>60)return 2;return d<7?0:1}

// ---------- renderer / scene
const cv=$('c'),R=new T.WebGLRenderer({canvas:cv,antialias:false});
let gfx=1;const setR=()=>{R.setPixelRatio(gfx?Math.min(devicePixelRatio,2):1);R.setSize(innerWidth,innerHeight)};setR();
const sc=new T.Scene();sc.background=new T.Color(0x9cc7e8);sc.fog=new T.Fog(0x9cc7e8,120,900);
const cam=new T.PerspectiveCamera(60,1,.5,1800);
addEventListener('resize',()=>{setR();cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
const amb=new T.HemisphereLight(0xcfe6ff,0x5a4a30,.9);sc.add(amb);
const sun=new T.DirectionalLight(0xfff0cc,1.1);sun.position.set(300,400,200);sc.add(sun);

// terrain
const N=220,tg=new T.PlaneGeometry(1400,1400,N,N);tg.rotateX(-Math.PI/2);
const pa=tg.attributes.position,col=new Float32Array(pa.count*3),C=new T.Color();
for(let i=0;i<pa.count;i++){const x=pa.getX(i),z=pa.getZ(i),h=H(x,z);pa.setY(i,h);const n=nrm(x,z),s=surf(x,z,h,n.y),k=hash(i,7)*.12;
if(h<Wl)C.setRGB(.35,.32,.25);else if(h>88)C.setRGB(.93,.95,1);else if(s==3)C.setRGB(.34,.23,.14);else if(s==2)C.setRGB(.45+k,.43+k,.4+k);else if(s==0)C.setRGB(.55+k,.43+k,.28);else C.setRGB(.22+k,.4+k,.16+k);
if(s==1&&h>45)C.lerp(new T.Color(.5,.47,.43),hs(45,70,h));col.set([C.r,C.g,C.b],i*3)}
tg.setAttribute('color',new T.BufferAttribute(col,3));tg.computeVertexNormals();
sc.add(new T.Mesh(tg,new T.MeshLambertMaterial({vertexColors:true})));
const wm=new T.Mesh(new T.PlaneGeometry(1400,1400),new T.MeshLambertMaterial({color:0x3d86b5,transparent:true,opacity:.72}));wm.rotation.x=-Math.PI/2;wm.position.y=Wl;sc.add(wm);

// colliders
const CE=20,grid=new Map(),cols=[];
function addCol(x,z,r,top){const o={x,z,r,top},k=Math.floor(x/CE)+','+Math.floor(z/CE);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(o)}

// trees & rocks
const tm=[],rm=[];
for(let t=0;t<3500&&tm.length<750;t++){const x=rnd(-640,640),z=rnd(-640,640),h=H(x,z);if(h<Wl+.5||h>62||Math.abs(x-xc(z))<11||Math.abs(z-zr(x))<30)continue;const n=nrm(x,z);if(n.y<.8)continue;const s=rnd(.8,1.7);tm.push([x,h,z,s]);addCol(x,z,.8*s,h+8)}
for(let t=0;t<2500&&rm.length<650;t++){const near=Math.random()<.5,z=rnd(-600,560),x=near?xc(z)+(Math.random()<.5?-1:1)*rnd(8,40):rnd(-640,640),h=H(x,z);if(h<Wl+.3||Math.abs(x-xc(z))<7.5)continue;const s=rnd(1,3.6)*(h>50?1.6:1);rm.push([x,h,z,s]);addCol(x,z,s*1.15,h+s*.8)}
const dm=new T.Object3D();
function inst(g,m,arr,f){const im=new T.InstancedMesh(g,m,arr.length);arr.forEach((a,i)=>{f(a);dm.updateMatrix();im.setMatrixAt(i,dm.matrix)});sc.add(im)}
inst(new T.ConeGeometry(2.2,8,6),new T.MeshLambertMaterial({color:0x2c5a2a}),tm,a=>{dm.position.set(a[0],a[1]+5,a[2]);dm.scale.setScalar(a[3]);dm.rotation.set(0,a[0],0)});
inst(new T.CylinderGeometry(.35,.5,3,5),new T.MeshLambertMaterial({color:0x4a3320}),tm,a=>{dm.position.set(a[0],a[1]+1,a[2]);dm.scale.setScalar(a[3]);dm.rotation.set(0,0,0)});
inst(new T.IcosahedronGeometry(1,0),new T.MeshLambertMaterial({color:0x7d7468,flatShading:true}),rm,a=>{dm.position.set(a[0],a[1]+a[3]*.2,a[2]);dm.scale.set(a[3],a[3]*.75,a[3]);dm.rotation.set(a[0],a[2],0)});

// route / waypoints
const WPS=[];for(let z=540;z>=-540;z-=18)WPS.push([xc(z),z]);const NW=WPS.length;

// bridge
{const rz=zr(xc(0)),bx=xc(rz),g=new T.Group(),mb=new T.MeshLambertMaterial({color:0x6b4a2a});
const dk=new T.Mesh(new T.BoxGeometry(9,.4,30),mb);dk.position.set(bx,1.2,rz);g.add(dk);
for(let k=-14;k<=14;k+=3.5)for(const sd of[-1,1]){const p=new T.Mesh(new T.BoxGeometry(.3,1.4,.3),mb);p.position.set(bx+sd*4.6,1.9,rz+k);g.add(p);addCol(bx+sd*4.7,rz+k,.6,9)}
for(const sd of[-1,1]){const r=new T.Mesh(new T.BoxGeometry(.2,.2,30),mb);r.position.set(bx+sd*4.6,2.5,rz);g.add(r)}sc.add(g)}

// base camp + repair station
const REPAIR_X=xc(540)+28,REPAIR_Z=545;
{const cx=REPAIR_X,m=[0xb5651d,0x8a8a8a,0x4a6a8a];
for(let i=0;i<3;i++){const b=new T.Mesh(new T.BoxGeometry(8,4,6),new T.MeshLambertMaterial({color:m[i]}));b.position.set(cx+i*11,H(cx+i*11,545)+2,545);sc.add(b);addCol(cx+i*11,545,5,9)}
const sg=new T.Mesh(new T.BoxGeometry(5,2,.3),new T.MeshBasicMaterial({color:0xffb300}));sg.position.set(xc(520)-9,H(xc(520)-9,520)+3,520);sc.add(sg);
// repair marker (glowing green cross)
const rm2=new T.Mesh(new T.BoxGeometry(4,.3,.6),new T.MeshBasicMaterial({color:0x00ff44}));rm2.position.set(cx-8,H(cx-8,545)+3,545);sc.add(rm2);
const rm3=new T.Mesh(new T.BoxGeometry(.6,.3,4),new T.MeshBasicMaterial({color:0x00ff44}));rm3.position.set(cx-8,H(cx-8,545)+3.2,545);sc.add(rm3)}

// checkpoints
const CPS=[];for(let i=12;i<NW;i+=12)CPS.push(i);if(CPS[CPS.length-1]!=NW-1)CPS.push(NW-1);
CPS.forEach((w,j)=>{const x=WPS[w][0],z=WPS[w][1],g=new T.Group(),fin=j==CPS.length-1,cm=new T.MeshLambertMaterial({color:fin?0xffffff:0xffb300});
for(const s of[-1,1]){const p=new T.Mesh(new T.CylinderGeometry(.25,.25,7,6),cm);p.position.set(x+s*7,H(x+s*7,z)+3.5,z);g.add(p)}
const bn=new T.Mesh(new T.BoxGeometry(14,1.2,.2),new T.MeshBasicMaterial({color:fin?0xdd2222:0xff8800}));bn.position.set(x,H(x,z)+7,z);g.add(bn);sc.add(g)});

// ---------- vehicles
const VD=[
  {n:'TRAILHAWK SUV',c:0xc8281e,m:1500,f:9500,vm:36,gp:1,k:1,st:[6,7,7,6,6],cost:0},
  {n:'IRON BULL 4x4',c:0x3d5a2c,m:2100,f:13000,vm:30,gp:1.12,k:1.15,st:[5,4,5,9,8],cost:600},
  {n:'DUNE RALLY',c:0xf2a900,m:1200,f:10500,vm:44,gp:1.05,k:.9,st:[9,9,9,5,5],cost:1200}
];
function mkCar(c,ws){const g=new T.Group(),M=x=>new T.MeshLambertMaterial({color:x});
const b=new T.Mesh(new T.BoxGeometry(1.8,.8,4.2),M(c));b.position.y=.25;g.add(b);
const ca=new T.Mesh(new T.BoxGeometry(1.7,.85,2.2),M(c));ca.position.set(0,1,-.2);g.add(ca);
const gl=new T.Mesh(new T.BoxGeometry(1.72,.5,2.0),new T.MeshLambertMaterial({color:0x223344}));gl.position.set(0,1.05,-.2);g.add(gl);
const rk=new T.Mesh(new T.BoxGeometry(1.5,.12,1.9),M(0x222222));rk.position.set(0,1.5,-.2);g.add(rk);
const bp=new T.Mesh(new T.BoxGeometry(1.9,.25,.3),M(0x222222));bp.position.set(0,.5,2.15);g.add(bp);
const sp=new T.Mesh(new T.CylinderGeometry(.4,.4,.3,12),M(0x151515));sp.rotation.x=Math.PI/2;sp.position.set(0,.5,-2.3);g.add(sp);
if(ws){g.w=[];[[.9,1.4],[-.9,1.4],[.9,-1.4],[-.9,-1.4]].forEach(l=>{const o=new T.Group(),w=new T.Mesh(new T.CylinderGeometry(.42,.42,.4,14),M(0x151515));w.rotation.z=Math.PI/2;w.add(new T.Mesh(new T.CylinderGeometry(.25,.25,.42,8),M(0x999999)).rotateZ(Math.PI/2));o.add(w);o.userData.l=l;o.userData.w=w;g.add(o);g.w.push(o)})};return g}

// ---------- SAVE STATE (extended)
const DEF={coins:0,un:[0],best:null,best_trial:null,sel:0,
  upg:{0:{e:0,s:0,t:0,n:0},1:{e:0,s:0,t:0,n:0},2:{e:0,s:0,t:0,n:0}},
  snd:1,music:0,night:0,tilt:0,
  champ:{active:false,race:0,scores:[0,0,0,0],done:false}};
let S=DEF;
try{const raw=JSON.parse(localStorage.getItem('orush2')||'{}');S=Object.assign(JSON.parse(JSON.stringify(DEF)),raw);
  if(!S.upg)S.upg=DEF.upg;if(!S.champ)S.champ=DEF.champ;if(!S.best_trial)S.best_trial=null;}catch(e){}
const save=()=>{try{localStorage.setItem('orush2',JSON.stringify(S))}catch(e){}};

// ---------- UPGRADES
const UPG_NAMES=['ENGINE','SUSPENSION','TIRES','NITRO'];
const UPG_KEYS=['e','s','t','n'];
const UPG_COST=[150,400,900]; // levels 1, 2, 3
function getUpg(k){return(S.upg[S.sel]||{e:0,s:0,t:0,n:0})[k]||0}
function applyUpgToVD(D){
  const u=S.upg[S.sel]||{e:0,s:0,t:0,n:0};
  return {
    ...D,
    f:D.f*(1+u.e*.15),
    vm:D.vm*(1+u.e*.08),
    gp:D.gp*(1+u.t*.1),
    k:D.k*(1+u.s*.08)
  };
}
function openUpg(){
  $('upgov').style.display='flex';
  renderUpgPanel();
}
function closeUpg(){$('upgov').style.display='none'}
function renderUpgPanel(){
  $('upgcoins').textContent='COINS: '+S.coins;
  const u=S.upg[S.sel]||{e:0,s:0,t:0,n:0};
  let h=`<div style="color:var(--a);font-size:18px;margin-bottom:8px">${VD[S.sel].n}</div>`;

    const gr=GR[sf]*D.gp;
    let fx=thr*(D.f*(IN.n&&nos>0?1.6:1))/4*(1-Math.min(1,Math.max(0,thr>0?vl/vmax:-vl/12)));
    fx-=cl(vl*m/4/dt,-1,1)*brk*(m/4*9.5)+vl*25;
    let fy=-vt*m/4*(IN.hb?4:9);if(sf==4){fx-=vl*m*.25;fy-=vt*m*.1}
    const mx=gr*fs,mg=Math.hypot(fx,fy),slip=mg>mx;
    if(slip){fx*=mx/mg;fy*=mx/mg}
    const Ft=Fn.add(f.multiplyScalar(fx)).add(lat.multiplyScalar(fy));F.add(Ft);Tq.add(new T.Vector3().crossVectors(r,Ft));
    WS[i]=slip&&thr?vl/Rr+thr*(sf==3?30:14):vl/Rr;
    if(sf>=3&&Math.abs(vl)>3&&Math.random()<.35)puff(p.x,g,p.z,sf==4?0xdde8f0:0x4a3220,car.v);
    else if(sf<3&&Math.abs(vl)>10&&Math.random()<.12)puff(p.x,g,p.z,0xb09a78,car.v);
  });
  const nosCapacity=1+(nosUpg>0?(nosUpg*.2):0);
  if(IN.n&&nos>0)F.addScaledVector(fw,m*5*(1+nosUpg*.2));
  F.addScaledVector(car.v,-Math.abs(car.v.length())*.5);
  car.v.addScaledVector(F,dt/m);
  const qi=car.q.clone().invert(),tl=Tq.applyQuaternion(qi).divide(I).multiplyScalar(dt).applyQuaternion(car.q);
  car.w.add(tl).multiplyScalar(1-1.2*dt);car.p.addScaledVector(car.v,dt);
  const q=car.q,wq=new T.Quaternion(car.w.x*dt/2,car.w.y*dt/2,car.w.z*dt/2,0).multiply(q);
  q.set(q.x+wq.x,q.y+wq.y,q.z+wq.z,q.w+wq.w).normalize();
  // collisions → damage
  for(const o of[-1.5,0,1.5]){const cp=car.p.clone().addScaledVector(fw,o),kx=Math.floor(cp.x/CE),kz=Math.floor(cp.z/CE);
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const A=grid.get((kx+a)+','+(kz+b));if(!A)continue;
  for(const c of A){const dx=cp.x-c.x,dz=cp.z-c.z,rr=c.r+1,d2=dx*dx+dz*dz;
  if(d2<rr*rr&&car.p.y<c.top+1){const d=Math.sqrt(d2)||.01,nx=dx/d,nz=dz/d,pen=rr-d;
  car.p.x+=nx*pen;car.p.z+=nz*pen;const vn_=car.v.x*nx+car.v.z*nz;
  if(vn_<0){car.v.x-=nx*vn_*1.35;car.v.z-=nz*vn_*1.35;if(vn_<-3){shake=Math.min(1,-vn_/12);beep(90,.15);takeDmg(Math.abs(vn_)*2);}}}}}
  const lim=690;if(Math.abs(car.p.x)>lim){car.p.x=Math.sign(car.p.x)*lim;car.v.x*=-.3;}
  if(Math.abs(car.p.z)>lim){car.p.z=Math.sign(car.p.z)*lim;car.v.z*=-.3;}
  if(nos>0&&IN.n)nos=Math.max(0,nos-dt/(6+nosUpg*2));else nos=Math.min(1+nosUpg*.25,nos+dt/20);
}

// ---------- PARTICLES
const PN=150,pp=new Float32Array(PN*3),pc=new Float32Array(PN*3),pg=new T.BufferGeometry(),pv=[];let pi=0;
for(let i=0;i<PN;i++){pv.push(new T.Vector3());pp[i*3+1]=-999}
pg.setAttribute('position',new T.BufferAttribute(pp,3));pg.setAttribute('color',new T.BufferAttribute(pc,3));
const pts=new T.Points(pg,new T.PointsMaterial({size:1.4,vertexColors:true,transparent:true,opacity:.8}));
pts.frustumCulled=false;sc.add(pts);
function puff(x,y,z,c,v){const i=pi++%PN,C=new T.Color(c);pp.set([x,y+.3,z],i*3);pc.set([C.r,C.g,C.b],i*3);pv[i].set(v.x*.3+rnd(-2,2),rnd(2,5),v.z*.3+rnd(-2,2))}
function updP(dt){for(let i=0;i<PN;i++){if(pp[i*3+1]<-900)continue;pv[i].y-=9*dt;pp[i*3]+=pv[i].x*dt;pp[i*3+1]+=pv[i].y*dt;pp[i*3+2]+=pv[i].z*dt;if(pv[i].y<-6)pp[i*3+1]=-999}pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true}

// ---------- INPUT
function hold(id,fn){const e=$(id);if(!e)return;const on=v=>ev=>{ev.preventDefault();fn(v);e.classList.toggle('on',!!v)};e.addEventListener('pointerdown',on(1));['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,on(0)))}
function tap2(id,f){const e=$(id);if(!e)return;e.addEventListener('pointerdown',ev=>{ev.preventDefault();f();});}
const sk={l:0,r:0};
hold('bl',v=>sk.l=v);hold('br',v=>sk.r=v);hold('gas',v=>IN.t=v);hold('brk',v=>IN.b=v);hold('nit',v=>IN.n=v);hold('hb',v=>IN.hb=v);
const tap=(id,f)=>{const e=$(id);if(e)e.addEventListener('pointerdown',ev=>{ev.preventDefault();f();})};
tap('bc',()=>camM=(camM+1)%4);tap('bm',()=>{paused=true;mapShow(1)});tap('bx',()=>place(passedWp()));
tap('bp',()=>{paused=true;showPn(`<h1>PAUSED</h1><button class="mb y" onclick="paused=false;$('ov').style.display='none'">RESUME</button><button class="mb" onclick="startMode(mode)">RESTART</button><button class="mb" onclick="menu()">EXIT TO MENU</button>`);});
$('map').addEventListener('pointerdown',e=>{if(e.target.tagName!='CANVAS'&&mode!='menu')paused=false});
const kk={};addEventListener('keydown',e=>{kk[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{kk[e.key.toLowerCase()]=0});
document.addEventListener('pointerdown',()=>{aInit();if(au&&au.state=='suspended')au.resume();try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}},{once:true});
const passedWp=()=>Math.max(0,Math.floor(progress)-1);

// ---------- MAIN LOOP
const clk=new T.Clock();let cyaw=0,fov=60,ghostFrameTimer=0;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);
if(mode=='menu'){
  const t=performance.now()/4000;
  if(!cm){cm=mkCar(VD[S.sel].c,true);sc.add(cm)}
  if(!cm.userData.m||cm.userData.m!=S.sel){sc.remove(cm);cm=mkCar(VD[S.sel].c,true);cm.userData.m=S.sel;sc.add(cm)}
  const a=WPS[8];cm.position.set(a[0],H(a[0],a[1])+.85,a[1]);cm.rotation.y=t;
  cam.position.set(a[0]+Math.sin(t*.5+1)*9,H(a[0],a[1])+3.5,a[1]+Math.cos(t*.5+1)*9);cam.lookAt(a[0],H(a[0],a[1])+1,a[1]);
  cm.w&&cm.w.forEach(o=>{o.position.set(o.userData.l[0],-.1-.3,o.userData.l[1])});R.render(sc,cam);return}
if(paused){R.render(sc,cam);return}
// tilt steering
if(tiltOn)IN.s=cl(tiltGamma/30,-1,1);
else IN.s=cl((sk.r?1:0)-(sk.l?1:0)+((kk.d||kk.arrowright)?1:0)-((kk.a||kk.arrowleft)?1:0),-1,1);
if(kk.w||kk.arrowup)IN.t=1;else if(!$('gas').classList.contains('on'))IN.t=0;
IN.b=IN.b||(kk.s||kk.arrowdown?1:0);if(kk[' '])IN.n=1;
if(cdT>0){const pc=Math.ceil(cdT);cdT-=dt;$('cd').textContent=cdT>0?Math.ceil(cdT):'GO!';
  if(cdT<=0){raceOn=true;setTimeout(()=>$('cd').style.display='none',700)}
  IN.t=0;AI.forEach(a=>{a.s=Math.max(a.s,0)});}
const go=mode=='free'||mode=='trial'||raceOn||finished;
steerV+=(IN.s-steerV)*Math.min(1,dt*9);const sv=IN.s;IN.s=steerV;
if(!(mode=='race'&&cdT>0))for(let i=0;i<3;i++)phys(dt/3);
IN.s=sv;
if(raceOn){raceT+=dt;updAI(dt)}
else if(mode=='trial'){raceT+=dt;}
// ghost recording/replay
if(mode=='trial'){
  ghostFrameTimer+=dt;
  if(ghostFrameTimer>1/30){ghostFrameTimer=0;if(isRecording)recordGhost();updateGhost();}
}
// progress tracking
{let best=1e9,bi=Math.floor(progress);
for(let i=Math.max(0,bi-6);i<Math.min(NW,bi+10);i++){const d=Math.hypot(WPS[i][0]-car.p.x,WPS[i][1]-car.p.z);if(d<best){best=d;bi=i}}
if(bi>progress)progress=bi;else if(bi<progress-2)progress=Math.max(progress,bi);
if(mode=='race'&&raceOn){if(progress>=CPS[nextCP]-.5&&nextCP<CPS.length-1){nextCP++;beep(880,.12);}
  if(progress>=NW-2&&!finished)finish();rank=1+AI.filter(a=>a.s>progress+.4).length}
if(mode=='trial'&&progress>=NW-2&&!finished)finishTrial();}
// repair station
checkRepair(dt);
// reset logic
const up=new T.Vector3(0,1,0).applyQuaternion(car.q);if(up.y<.3&&car.v.length()<3)flipT+=dt;else flipT=0;
if(flipT>2.5||car.p.y<-15||car.p.y<H(car.p.x,car.p.z)-3)place(passedWp());
// visuals
cm.position.copy(car.p);cm.quaternion.copy(car.q);
const sa=IN.s*.45/(1+car.v.length()/25);
cm.w.forEach((o,i)=>{const l=o.userData.l;o.position.set(l[0],-.1-WL[i],l[1]);o.rotation.y=i<2?sa:0;o.userData.w.rotation.x+=WS[i]*dt});
const fw=new T.Vector3(0,0,1).applyQuaternion(car.q),spd=car.v.length(),tY=Math.atan2(fw.x,fw.z);
let dy=tY-cyaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));cyaw+=dy*Math.min(1,dt*(camM==3?20:3.5));
const CM=[[11,4.2],[8,3.1],[5.5,2.1]][Math.min(camM,2)];shake=Math.max(0,shake-dt*2);
if(camM==3){cam.position.copy(car.p).add(new T.Vector3(0,1.5,.3).applyQuaternion(car.q));cam.quaternion.copy(car.q);cam.rotateY(Math.PI)}
else{const tp=new T.Vector3(car.p.x-Math.sin(cyaw)*CM[0],0,car.p.z-Math.cos(cyaw)*CM[0]);
  tp.y=Math.max(car.p.y+CM[1],H(tp.x,tp.z)+1.6);cam.position.lerp(tp,Math.min(1,dt*6));
  cam.position.y=Math.max(cam.position.y,H(cam.position.x,cam.position.z)+1.2);cam.lookAt(car.p.x,car.p.y+1.2,car.p.z)}
if(shake>0)cam.position.add(new T.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).multiplyScalar(shake*.4));
fov+=((58+Math.min(spd,40)*.6+(IN.n&&nos>0?8:0))-fov)*dt*3;cam.fov=fov;cam.updateProjectionMatrix();
updP(dt);
// engine sound with gears
if(au&&gn&&S.snd){
  const gear=Math.floor(spd/8)+1;const gearFreq=40+(spd%8)*8+gear*15+IN.t*25;
  gn.gain.value=.05+IN.t*.04;osc.frequency.value=gearFreq;}
// background music pulse
if(musicOsc&&S.music){musicOsc.frequency.value=55+Math.sin(performance.now()/2000)*5;}
// HUD
$('spd').textContent=Math.round(spd*3.6)+' KM/H';
$('tl').innerHTML=mode=='race'?`POS ${rank}/4 &nbsp; ${tf(raceT)}`:mode=='trial'?`⏱ ${tf(raceT)}${S.best_trial?' | BEST '+tf(S.best_trial):''}`:' FREE ROAM';
$('obj').textContent=mode=='race'?(cdT>0?'GET READY':'CHECKPOINT '+(nextCP+1)+'/'+CPS.length+' — '+Math.round(Math.hypot(WPS[CPS[nextCP]][0]-car.p.x,WPS[CPS[nextCP]][1]-car.p.z))+' m'):mode=='trial'?'REACH THE FINISH':'EXPLORE: FOREST · RIVER · MUD · MOUNTAIN';
$('nit').style.opacity=.4+nos*.6;drawMM();R.render(sc,cam)}
menu();loop();
</script></body></html>
