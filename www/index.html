function puff(x,y,z,c,v){const i=pi++%PN,C=new T.Color(c);pp.set([x,y+.3,z],i*3);pc.set([C.r,C.g,C.b],i*3);pv[i].set(v.x*.3+rnd(-2,2),rnd(2,5),v.z*.3+rnd(-2,2))}
function updP(dt){for(let i=0;i<PN;i++){if(pp[i*3+1]<-900)continue;pv[i].y-=9*dt;pp[i*3]+=pv[i].x*dt;pp[i*3+1]+=pv[i].y*dt;pp[i*3+2]+=pv[i].z*dt;if(pv[i].y<-6)pp[i*3+1]=-999}pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true}
// audio
let au,osc,gn;function aInit(){if(au)return;try{au=new(window.AudioContext||window.webkitAudioContext)();osc=au.createOscillator();osc.type='sawtooth';gn=au.createGain();gn.gain.value=0;osc.connect(gn).connect(au.destination);osc.start()}catch(e){}}
function beep(f,d){if(!au)return;try{const o=au.createOscillator(),g=au.createGain();o.frequency.value=f;g.gain.value=.15;g.gain.exponentialRampToValueAtTime(.001,au.currentTime+d);o.connect(g).connect(au.destination);o.start();o.stop(au.currentTime+d)}catch(e){}}
// ---------- AI (kinematic, follows route on terrain)
let AI=[];const AIM=[0xe8e8e8,0x2a62c8,0x9a2ad0];function mkAI(){AI.forEach(a=>sc.remove(a.m));AI=[];const sp=[.55,.5,.45][diff]*0+[.8,1,1.18][diff];for(let i=0;i<3;i++){const m=mkCar(AIM[i],false);sc.add(m);AI.push({m,s:.8+i*.5,lat:[-3,3,0][i],sp:sp*(.95+i*.04),t:Math.random()*9,pq:new T.Quaternion()})}}
function updAI(dt){AI.forEach(a=>{const i=Math.min(NW-2,Math.floor(a.s)),f=a.s-i,A=WPS[i],Bp=WPS[i+1],x=lerp(A[0],Bp[0],f),z=lerp(A[1],Bp[1],f),dx=Bp[0]-A[0],dz=Bp[1]-A[1],l=Math.hypot(dx,dz),px=x+dz/l*a.lat*-1,pz=z-dx/l*a.lat*-1*0+(-dx/l)*a.lat*0;
const h=H(px,pz),n=nrm(px,pz),sf=surf(px,pz,h,n.y);a.t+=dt;let v=24*a.sp*(sf==3?.55:sf==4?.6:1)*(1-.25*Math.max(0,(h-H(x+dx/l*10,z+dz/l*10))*-.1));if(diff==0&&Math.sin(a.t*.7+a.lat)>.85)v*=.5;v*=1+(raceOn?cl((progress-a.s)*.03,-.1,.12):0)*(diff==2?1:.6);
a.s+=v*dt/18;const fwd=new T.Vector3(dx/l,0,dz/l);fwd.addScaledVector(n,-fwd.dot(n)).normalize();const rt=new T.Vector3().crossVectors(n,fwd).negate(),mt=new T.Matrix4().makeBasis(rt.clone().negate(),n,fwd);const tq=new T.Quaternion().setFromRotationMatrix(mt);a.m.quaternion.slerp(tq,.12);a.m.position.set(px,h+.85,pz);if(a.s>=NW-1)a.s=NW-1})}
// ---------- race state
let progress=0,nextCP=0,rank=1,passed=0;
function startMode(m){aInit();mode=m;S.sel=S.sel;save();paused=false;finished=false;if(cm)sc.remove(cm);cm=mkCar(VD[S.sel].c,true);sc.add(cm);$('ov').style.display='none';$('hud').style.display='block';progress=0;nextCP=0;passed=0;raceT=0;raceOn=false;IN.s=IN.t=IN.b=IN.n=0;
if(m=='race'){place(0);mkAI();cdT=3.99;$('cd').style.display='flex'}else{place(2);AI.forEach(a=>sc.remove(a.m));AI=[];$('cd').style.display='none'}}
function finish(){finished=true;raceOn=false;const pos=1+AI.filter(a=>a.s>=NW-1.5).length;const rw=[500,300,200,100][pos-1]||100;S.coins+=rw;if(!S.best||raceT<S.best)S.best=raceT;save();
const tf=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+(t%60).toFixed(2).padStart(5,'0');showPn(`<h1>RACE <span>COMPLETE</span></h1><p style="font-size:30px;margin:8px">POSITION ${['1st','2nd','3rd','4th'][pos-1]}</p><p>TIME ${tf(raceT)}<br>BEST ${tf(S.best)}<br><span style="color:var(--a)">+${rw} COINS</span> (total ${S.coins})</p><button class="mb y" onclick="startMode('race')">RETRY</button><button class="mb" onclick="menu()">GARAGE / MENU</button>`);$('hud').style.display='none'}
const tf=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+(t%60).toFixed(1).padStart(4,'0');
// ---------- menu
function showPn(h){$('pn').innerHTML=h;$('ov').style.display='flex'}
function menu(){mode='menu';$('hud').style.display='none';$('cd').style.display='none';const D=VD[S.sel],un=S.un.includes(S.sel),L=['TOP SPEED','ACCEL','HANDLING','OFF-ROAD','BRAKING'];
showPn(`<h1>OFFROAD <span>RUSH</span></h1><div style="margin:6px 0;font-size:13px;color:#aaa">COINS: ${S.coins}</div><div style="display:flex;align-items:center;gap:8px"><button class="mb" style="width:44px" onclick="vs(-1)">◀</button><div style="flex:1"><div style="font-size:22px;color:var(--a)">${D.n}</div><div class="st">${L.map((l,i)=>l+`<div class="bar"><i style="width:${D.st[i]*10}%"></i></div>`).join('')}</div></div><button class="mb" style="width:44px" onclick="vs(1)">▶</button></div>
${un?`<button class="mb y" onclick="startMode('race')">RACE</button><button class="mb" onclick="startMode('free')">FREE ROAM</button>`:`<button class="mb y" onclick="buy()">UNLOCK ${D.cost} COINS</button>`}
<button class="mb" onclick="diff=(diff+1)%3;menu()">AI: ${['EASY','NORMAL','HARD'][diff]}</button><button class="mb" onclick="gfx^=1;setR();menu()">GRAPHICS: ${gfx?'HIGH':'LOW'}</button><button class="mb" onclick="mapShow(1)">MAP</button>`)}
window.vs=d=>{S.sel=(S.sel+d+VD.length)%VD.length;save();menu()};window.buy=()=>{const D=VD[S.sel];if(S.coins>=D.cost){S.coins-=D.cost;S.un.push(S.sel);save()}menu()};window.menu=menu;window.startMode=startMode;
// ---------- map
const mapImg=document.createElement('canvas');mapImg.width=mapImg.height=200;{const x=mapImg.getContext('2d'),im=x.createImageData(200,200);for(let j=0;j<200;j++)for(let i=0;i<200;i++){const wx=i*7-700,wz=j*7-700,h=H(wx,wz),o=(j*200+i)*4;let c=[70,120,50];if(h<Wl)c=[50,110,180];else if(h>88)c=[240,240,250];else if(h>45)c=[130,120,110];else if(surf(wx,wz,h,1)==3)c=[90,60,35];im.data.set([...c,255],o)}x.putImageData(im,0,0);x.strokeStyle='#ffb300';x.lineWidth=1.5;x.beginPath();WPS.forEach((w,i)=>{const a=(w[0]+700)/7,b=(w[1]+700)/7;i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke()}
function mapShow(v){$('map').style.display=v?'flex':'none';if(!v)return;const x=$('mc').getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(mapImg,0,0,560,560);const P=(a,b,c,t)=>{x.fillStyle=c;x.beginPath();x.arc((a+700)*.4,(b+700)*.4,6,0,7);x.fill();x.fillStyle='#fff';x.font='13px Arial';x.fillText(t,(a+700)*.4+9,(b+700)*.4+4)};P(WPS[0][0],WPS[0][1],'#2c2','START');P(WPS[NW-1][0],WPS[NW-1][1],'#e22','FINISH');P(xc(zr(0)),zr(xc(0)),'#fa0','BRIDGE');P(xc(-290),-290,'#a63','MUD');P(xc(-470),-470,'#f80','JUMP');P(xc(540)+35,545,'#4af','BASE CAMP');if(mode!='menu')P(car.p.x,car.p.z,'#fff','YOU')}
window.mapShow=mapShow;
function drawMM(){const x=$('mm').getContext('2d');x.save();x.clearRect(0,0,240,240);x.beginPath();x.arc(120,120,120,0,7);x.clip();const fw=new T.Vector3(0,0,1).applyQuaternion(car.q),yaw=Math.atan2(fw.x,fw.z);x.translate(120,120);x.rotate(Math.PI+yaw);const sc2=240/(100*2)*1.0;x.scale(sc2*7/7*.9,sc2*.9);x.drawImage(mapImg,-(car.p.x+700)/7*7/7*1,-(car.p.z+700)/7,200,200);x.restore();
x.fillStyle='#fff';x.beginPath();x.moveTo(120,106);x.lineTo(112,128);x.lineTo(128,128);x.fill();x.save();x.translate(120,120);x.rotate(Math.PI+yaw);x.fillStyle='#4af';AI.forEach(a=>{x.beginPath();x.arc((a.m.position.x-car.p.x)/7*sc2*.9,(a.m.position.z-car.p.z)/7*sc2*.9,3,0,7);x.fill()});
if(raceOn){x.fillStyle='#ff0';const w=WPS[CPS[Math.min(nextCP,CPS.length-1)]];x.beginPath();x.arc((w[0]-car.p.x)/7*sc2*.9,(w[1]-car.p.z)/7*sc2*.9,4,0,7);x.fill()}x.restore()}
// ---------- input
function hold(id,fn){const e=$(id);const on=v=>ev=>{ev.preventDefault();fn(v);e.classList.toggle('on',!!v)};e.addEventListener('pointerdown',on(1));['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,on(0)))}
const sk={l:0,r:0};hold('bl',v=>sk.l=v);hold('br',v=>sk.r=v);hold('gas',v=>IN.t=v);hold('brk',v=>IN.b=v);hold('nit',v=>IN.n=v);
const tap=(id,f)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();f()});tap('bc',()=>camM=(camM+1)%4);tap('bm',()=>{paused=true;mapShow(1)});tap('bx',()=>place(passedWp()));
tap('bp',()=>{paused=true;showPn(`<h1>PAUSED</h1><button class="mb y" onclick="paused=false;$('ov').style.display='none'">RESUME</button><button class="mb" onclick="startMode(mode)">RESTART</button><button class="mb" onclick="menu()">EXIT TO MENU</button>`)});
$('map').addEventListener('pointerdown',e=>{if(e.target.tagName!='CANVAS'&&mode!='menu')paused=false});
const kk={};addEventListener('keydown',e=>{kk[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{kk[e.key.toLowerCase()]=0});
document.addEventListener('pointerdown',()=>{aInit();if(au&&au.state=='suspended')au.resume();try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}},{once:true});
const passedWp=()=>Math.max(0,Math.floor(progress)-1);
// ---------- main loop
const clk=new T.Clock();let cyaw=0,fov=60;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);
if(mode=='menu'){const t=performance.now()/4000;if(!cm){cm=mkCar(VD[S.sel].c,true);sc.add(cm)}if(!cm.userData.m||cm.userData.m!=S.sel){sc.remove(cm);cm=mkCar(VD[S.sel].c,true);cm.userData.m=S.sel;sc.add(cm)}
const a=WPS[8];cm.position.set(a[0],H(a[0],a[1])+.85,a[1]);cm.rotation.y=t;cam.position.set(a[0]+Math.sin(t*.5+1)*9,H(a[0],a[1])+3.5,a[1]+Math.cos(t*.5+1)*9);cam.lookAt(a[0],H(a[0],a[1])+1,a[1]);cm.w&&cm.w.forEach(o=>{o.position.set(o.userData.l[0],-.1-.3,o.userData.l[1])});R.render(sc,cam);return}
if(paused){R.render(sc,cam);return}
IN.s=cl((sk.r?1:0)-(sk.l?1:0)+((kk.d||kk.arrowright)?1:0)-((kk.a||kk.arrowleft)?1:0),-1,1);if(kk.w||kk.arrowup)IN.t=1;else if(!$('gas').classList.contains('on'))IN.t=0;IN.b=IN.b||(kk.s||kk.arrowdown?1:0);if(kk[' '])IN.n=1;
if(cdT>0){const pc=Math.ceil(cdT);cdT-=dt;$('cd').textContent=cdT>0?Math.ceil(cdT):'GO!';if(cdT<=0){raceOn=true;setTimeout(()=>$('cd').style.display='none',700)}
IN.t=0;AI.forEach(a=>{a.s=Math.max(a.s,0)});}
const go=mode=='free'||raceOn||finished;const ss=go?3:0;if(mode=='race'&&cdT>0){/* hold on grid */car.v.set(0,0,0)}
steerV+=(IN.s-steerV)*Math.min(1,dt*9);const sv=IN.s;IN.s=steerV;if(!(mode=='race'&&cdT>0))for(let i=0;i<3;i++)phys(dt/3);IN.s=sv;
if(raceOn){raceT+=dt;updAI(dt)}else if(mode=='race'&&cdT>0){}
// progress
{let best=1e9,bi=Math.floor(progress);for(let i=Math.max(0,bi-6);i<Math.min(NW,bi+10);i++){const d=Math.hypot(WPS[i][0]-car.p.x,WPS[i][1]-car.p.z);if(d<best){best=d;bi=i}}if(bi>progress)progress=bi;else if(bi<progress-2)progress=Math.max(progress,bi);if(mode=='race'&&raceOn){if(progress>=CPS[nextCP]-.5&&nextCP<CPS.length-1)nextCP++;if(progress>=NW-2&&!finished)finish();rank=1+AI.filter(a=>a.s>progress+.4).length}}
// reset logic
const up=new T.Vector3(0,1,0).applyQuaternion(car.q);if(up.y<.3&&car.v.length()<3)flipT+=dt;else flipT=0;if(flipT>2.5||car.p.y<-15||car.p.y<H(car.p.x,car.p.z)-3)place(passedWp());
// visuals
cm.position.copy(car.p);cm.quaternion.copy(car.q);cm.children[0].parent===cm;const sa=IN.s*.45/(1+car.v.length()/25);
cm.w.forEach((o,i)=>{const l=o.userData.l;o.position.set(l[0],-.1-WL[i],l[1]);o.rotation.y=i<2?sa:0;o.userData.w.rotation.x+=WS[i]*dt});
const fw=new T.Vector3(0,0,1).applyQuaternion(car.q),spd=car.v.length(),tY=Math.atan2(fw.x,fw.z);let dy=tY-cyaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));cyaw+=dy*Math.min(1,dt*(camM==3?20:3.5));
const CM=[[11,4.2],[8,3.1],[5.5,2.1]][Math.min(camM,2)];shake=Math.max(0,shake-dt*2);
if(camM==3){cam.position.copy(car.p).add(new T.Vector3(0,1.5,.3).applyQuaternion(car.q));cam.quaternion.copy(car.q);cam.rotateY(Math.PI)}
else{const tp=new T.Vector3(car.p.x-Math.sin(cyaw)*CM[0],0,car.p.z-Math.cos(cyaw)*CM[0]);tp.y=Math.max(car.p.y+CM[1],H(tp.x,tp.z)+1.6);cam.position.lerp(tp,Math.min(1,dt*6));cam.position.y=Math.max(cam.position.y,H(cam.position.x,cam.position.z)+1.2);cam.lookAt(car.p.x,car.p.y+1.2,car.p.z)}
if(shake>0)cam.position.add(new T.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).multiplyScalar(shake*.4));
fov+=((58+Math.min(spd,40)*.6+(IN.n&&nos>0?8:0))-fov)*dt*3;cam.fov=fov;cam.updateProjectionMatrix();
updP(dt);if(gn){gn.gain.value=.05+IN.t*.04;osc.frequency.value=40+spd*3.2+IN.t*25}
// hud
$('spd').textContent=Math.round(spd*3.6)+' KM/H';$('tl').innerHTML=mode=='race'?`POS ${rank}/4 &nbsp; ${tf(raceT)}`:'FREE ROAM';
$('obj').textContent=mode=='race'?(cdT>0?'GET READY':'CHECKPOINT '+(nextCP+1)+'/'+CPS.length+' — '+Math.round(Math.hypot(WPS[CPS[nextCP]][0]-car.p.x,WPS[CPS[nextCP]][1]-car.p.z))+' m'):'EXPLORE: FOREST · RIVER · MUD · MOUNTAIN';
$('nit').style.opacity=.4+nos*.6;drawMM();R.render(sc,cam)}
menu();loop();
</script></body></html>
